# Postgres sync + duas redes: app (API↔primary) e repl (primary↔réplica)
name: sd03-particao-postgres

networks:
  app_net:
  repl_net:

services:
  postgres-primary:
    image: bitnamilegacy/postgresql:16.6.0-debian-12-r2@sha256:af9927a44db2c3fcf145a0d6bf10541605f6f0b3fbf80f6db66d33c7fb4125ea
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_USERNAME: portal
      POSTGRESQL_PASSWORD: portal
      POSTGRESQL_POSTGRES_PASSWORD: portaladmin
      POSTGRESQL_DATABASE: portal
      # Boot com 0 sync: init SQL não pode esperar réplica (deadlock Bitnami).
      # Após up, rode ./scripts/ativar-sync.sh (usa user postgres / portaladmin).
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: "0"
      POSTGRESQL_SYNCHRONOUS_REPLICAS_MODE: ANY
      POSTGRESQL_SYNCHRONOUS_COMMIT_MODE: on
    volumes:
      - ./primary/init:/docker-entrypoint-initdb.d:ro,Z
      - postgres_primary_data:/bitnami/postgresql
    ports:
      - "5436:5432"
    networks:
      - app_net
      - repl_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-replica:
    image: bitnamilegacy/postgresql:16.6.0-debian-12-r2@sha256:af9927a44db2c3fcf145a0d6bf10541605f6f0b3fbf80f6db66d33c7fb4125ea
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_PASSWORD: portal
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5437:5432"
    networks:
      - repl_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres-primary port=5432 dbname=portal user=portal password=portal
      REPLICA_DSN: host=postgres-replica port=5432 dbname=portal user=portal password=portal
      STATEMENT_TIMEOUT_MS: "45000"
    ports:
      - "8085:8000"
    networks:
      - app_net
      - repl_net
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  postgres_primary_data:
