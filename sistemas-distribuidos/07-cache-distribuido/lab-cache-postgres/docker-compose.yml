# Timeout / retry — boletim Postgres + Redis
name: sd07-cache-postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - ./primary/init:/docker-entrypoint-initdb.d:ro,Z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      REDIS_URL: redis://redis:6379/0
      STORE_HOLD_MS: "0"
      CACHE_BACKEND: redis
      CACHE_TTL_SEC: "60"
      INVALIDATE_ON_WRITE: "1"
      STAMPEDE_LOCK: "0"
      TTL_JITTER_SEC: "0"
    ports:
      - "8094:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
