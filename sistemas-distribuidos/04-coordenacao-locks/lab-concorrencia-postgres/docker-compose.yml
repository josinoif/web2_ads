# Três instâncias de API + Postgres — concorrência e exclusão mútua
name: sd04-concorrencia-postgres

services:
  postgres:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_USERNAME: portal
      POSTGRESQL_PASSWORD: portal
      POSTGRESQL_DATABASE: portal
    volumes:
      - ./primary/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/bitnami/postgresql
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  api1:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      INSTANCE_ID: api-1
      RACE_DELAY_MS: "150"
    depends_on:
      postgres:
        condition: service_healthy

  api2:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      INSTANCE_ID: api-2
      RACE_DELAY_MS: "150"
    depends_on:
      postgres:
        condition: service_healthy

  api3:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      INSTANCE_ID: api-3
      RACE_DELAY_MS: "150"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8087:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  postgres_data:
