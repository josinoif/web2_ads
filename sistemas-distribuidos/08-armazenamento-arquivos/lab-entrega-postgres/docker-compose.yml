# Entrega de trabalhos — Postgres + MinIO
name: sd08-entrega-postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - ./primary/init:/docker-entrypoint-initdb.d:ro,Z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"
      - "9011:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/trabalhos || true;
      exit 0;
      "

  api1:
    build: ./api
    environment:
      INSTANCE_ID: api1
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: trabalhos
      MINIO_SECURE: "0"
      STORAGE_BACKEND: minio
      FAIL_AFTER_BLOB: "0"
      LOCAL_UPLOAD_DIR: /data/uploads
    volumes:
      - api1_uploads:/data/uploads
    ports:
      - "8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  api2:
    build: ./api
    environment:
      INSTANCE_ID: api2
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: trabalhos
      MINIO_SECURE: "0"
      STORAGE_BACKEND: minio
      FAIL_AFTER_BLOB: "0"
      LOCAL_UPLOAD_DIR: /data/uploads
    volumes:
      - api2_uploads:/data/uploads
    ports:
      - "8091:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  api1_uploads:
  api2_uploads:
