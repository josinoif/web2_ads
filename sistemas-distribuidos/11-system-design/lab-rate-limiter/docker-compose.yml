name: sd11-rate-limiter

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6394:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  closed:
    build: ./api
    ports:
      - "8160:8000"
    environment:
      FAIL_MODE: closed
      RATE_LIMIT: "5"
      RATE_WINDOW_SEC: "10"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  open:
    build: ./api
    ports:
      - "8161:8000"
    environment:
      FAIL_MODE: open
      RATE_LIMIT: "5"
      RATE_WINDOW_SEC: "10"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
