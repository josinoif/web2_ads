# Timeout / retry / idempotência — matrícula Postgres
name: sd06-timeout-postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - ./primary/init:/docker-entrypoint-initdb.d:ro,Z
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      PRIMARY_DSN: host=postgres port=5432 dbname=portal user=portal password=portal
      STORE_HOLD_MS: "0"
      FAIL_RATE: "0"
      CB_THRESHOLD: "5"
      CB_OPEN_SEC: "8"
      CB_WINDOW_SEC: "60"
      IDEM_TTL_SEC: "3600"
    ports:
      - "8092:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
