upstream api_backend {
    # DNS dos serviços Compose — após recreate das APIs, recreate o nginx
    # (IPs mudam; nginx resolve no start).
    server api1:8000 max_fails=3 fail_timeout=5s;
    server api2:8000 max_fails=3 fail_timeout=5s;
    server api3:8000 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
